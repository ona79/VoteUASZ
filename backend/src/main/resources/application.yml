spring:
  main:
    allow-circular-references: true
  application:
    name: vote-uasz-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:voteuaszdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  web:
    resources:
      static-locations: file:./static/,classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:noreply@voteuasz.sn}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  mail:
    from: ${APP_MAIL_FROM:noreply@voteuasz.sn}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24 heures
  otp:
    expiration-minutes: 5
  crypto:
    secret-key: ${CRYPTO_SECRET_KEY:${CRYPTO_SECRET}}
  default-electeur-password: ${DEFAULT_ELECTEUR_PASSWORD:CHANGEME_REQUIRED_ELECTEUR_PASSWORD_2026}
  default-candidat-password: ${DEFAULT_CANDIDAT_PASSWORD:CHANGEME_REQUIRED_CANDIDAT_PASSWORD_2026}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org:
      springframework:
        security: DEBUG

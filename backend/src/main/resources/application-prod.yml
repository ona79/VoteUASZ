server:
  # Résout request.getRemoteAddr() depuis X-Forwarded-For injecté par Render (proxy de confiance).
  # Empêche le spoofing client : seul l'IP ajoutée par le proxy est utilisée.
  forward-headers-strategy: native

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DB}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

  web:
    resources:
      static-locations: file:./static/,classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/

logging:
  level:
    org:
      springframework:
        security: WARN

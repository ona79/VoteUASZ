spring:
  datasource:
    url: jdbc:h2:mem:voteuaszdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: TestJwtSecretKeyForUnitTestPurposeOnlyMinimum256BitsLong!
    expiration-ms: 86400000
  otp:
    expiration-minutes: 5
  crypto:
    secret-key: TestCryptoSecretKeyForUnitTestAES256!
  default-electeur-password: TestElecteurDefaultPassword2026!
  default-candidat-password: TestCandidatDefaultPassword2026!

<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteUASZ – Plateforme sécurisée d'élections universitaires</title>
  <meta name="description"
    content="Plateforme de vote électronique sécurisée pour l'Université Assane Seck de Ziguinchor (UASZ). Unicité du vote, anonymat et dépouillement en temps réel.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="brand" style="display: flex; align-items: center; gap: 0.5rem;">
      <img src="photos/logo_vote_uasz.PNG" alt="VoteUASZ" style="height: 32px; width: auto; border-radius: 6px; background: white; padding: 2px;">
      <span>VoteUASZ</span>
      <span class="brand-badge">SÉCURISÉ</span>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active" onclick="setActiveTab('admin')"> Admin</button>
      <button class="nav-btn" onclick="setActiveTab('commission')"> Commission</button>
      <button class="nav-btn" onclick="setActiveTab('candidat')"> Candidat</button>
      <button class="nav-btn" onclick="setActiveTab('elector')"> Voter</button>
      <button class="nav-btn" onclick="setActiveTab('live')"> Live</button>
      <button class="nav-btn" onclick="setActiveTab('audit')"> Audit</button>
    </nav>

    <!-- Role Simulator Pill -->
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <div id="user-pill-container"></div>
      <select onchange="switchRole(this.value)" class="form-control"
        style="padding: 0.35rem 0.6rem; font-size: 0.8rem; width: auto; background: #1e293b; color: white;">
        <option value="SUPER_ADMIN">Role: Super-Admin</option>
        <option value="COMMISSION_ELECTORALE">Role: Commission</option>
        <option value="CANDIDAT">Role: Candidat</option>
        <option value="ELECTEUR">Role: Électeur</option>
      </select>
    </div>
  </header>

  <!-- Main Dynamic Container -->
  <main class="container" id="main-content">
    <!-- Dynamic Content Rendered by app.js -->
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 Université Assane Seck de Ziguinchor (UASZ) — Plateforme de Vote Électronique Sécurisé </p>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration error', err));
      });
    }
  </script>
</body>

</html>

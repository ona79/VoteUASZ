services:
  postgres:
    image: postgres:16-alpine
    container_name: voteuasz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voteuasz_db}
      POSTGRES_USER: ${POSTGRES_USER:-uasz_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5540:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-uasz_admin} -d $${POSTGRES_DB:-voteuasz_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: voteuasz-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI pour visualiser les emails/codes OTP
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "1025" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voteuasz-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-voteuasz_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-uasz_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_healthy

volumes:
  postgres_data:

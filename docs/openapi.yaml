openapi: 3.0.3
info:
  title: VoteUASZ API — Plateforme Sécurisée d'Élections Universitaires
  description: |
    API REST de la plateforme VoteUASZ pour l'Université Assane Seck de Ziguinchor (UASZ).
    Gère l'authentification JWT, l'import CSV des électeurs, la machine à états des élections,
    le dépôt de candidature avec vidéos, le vote anonyme chiffré AES-256 avec OTP et les réclamations.
  version: 1.0.0
  contact:
    name: Équipe de Développement UASZ
    email: support-vote@uasz.sn
servers:
  - url: http://localhost:8080/api/v1
    description: Serveur Local de Développement
  - url: https://voteuasz-backend.onrender.com/api/v1
    description: Serveur de Production Cloud (Render)

paths:
  /auth/login:
    post:
      summary: Authentification des utilisateurs (Super-Admin, Commission, Candidat, Électeur)
      operationId: login
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matriculeOrEmail, password]
              properties:
                matriculeOrEmail:
                  type: string
                  example: "20230001"
                password:
                  type: string
                  example: "MonMotDePasseSecurise123!"
      responses:
        '200':
          description: Connexion réussie, retourne le Token JWT
        '429':
          description: Trop de requêtes depuis cette adresse IP (rate limit 20 req/min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  id:
                    type: integer
                  matricule:
                    type: string
                  nom:
                    type: string
                  prenom:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum: [SUPER_ADMIN, COMMISSION_ELECTORALE, CANDIDAT, ELECTEUR]
                  typeElecteur:
                    type: string
                    enum: [ETUDIANT, ENSEIGNANT, PATS]
                  ufr:
                    type: string
                  filiere:
                    type: string
                  niveau:
                    type: string
                  mustChangePassword:
                    type: boolean

  /auth/refresh:
    post:
      summary: Renouveler le JWT via un refresh token valide (avec rotation)
      operationId: refresh
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nouveaux JWT et refresh token (inclut mustChangePassword)
        '401':
          description: Refresh token invalide, expiré ou révoqué

  /auth/forgot-password:
    post:
      summary: Demander un code de réinitialisation de mot de passe (cooldown 60 s, réponse neutre)
      operationId: forgotPassword
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier:
                  type: string
      responses:
        '200':
          description: Réponse neutre constante (anti-énumération)
        '429':
          description: Trop de requêtes (limite 20 req/min/IP)

  /auth/reset-password:
    post:
      summary: Réinitialiser le mot de passe avec le code à 6 chiffres (max 5 tentatives)
      operationId: resetPassword
      tags: [Authentification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code, newPassword]
              properties:
                identifier:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Mot de passe réinitialisé (mustChangePassword repasse à false)
        '400':
          description: Code de réinitialisation invalide ou expiré (message générique)
        '429':
          description: Trop de requêtes (limite 20 req/min/IP)

  /auth/change-password:
    post:
      summary: Modifier le mot de passe de l'utilisateur connecté (>= 8 caractères, différent de l'ancien)
      operationId: changePassword
      tags: [Authentification]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Mot de passe modifié (mustChangePassword repasse à false)
        '400':
          description: Mot de passe trop court ou identique à l'ancien
        '401':
          description: Authentification requise ou mot de passe actuel incorrect

  /admin/users/import-csv:
    post:
      summary: Importation en masse des comptes électeurs via fichier CSV (Super-Admin uniquement)
      operationId: importCsv
      tags: [Administration]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Rapport d'importation CSV
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalSuccess:
                    type: integer
                  totalFailed:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string

  /elections:
    get:
      summary: Lister toutes les élections (filtrables par statut et éligibilité)
      operationId: getAllElections
      tags: [Élections]
      responses:
        '200':
          description: Liste des élections

    post:
      summary: Créer une nouvelle élection (Super-Admin uniquement)
      operationId: createElection
      tags: [Élections]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, type, dateDebut, dateFin]
              properties:
                titre:
                  type: string
                description:
                  type: string
                type:
                  type: string
                  enum: [DELEGUE, DUFR, VICE_RECTEUR]
                targetUfr:
                  type: string
                targetFiliere:
                  type: string
                targetNiveau:
                  type: string
                dateDebut:
                  type: string
                  format: date-time
                dateFin:
                  type: string
                  format: date-time

  /elections/{id}/status:
    patch:
      summary: Changer le statut de la machine à états d'une élection
      operationId: updateElectionStatus
      tags: [Élections]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStatus]
              properties:
                newStatus:
                  type: string
                  enum: [CONFIGURATION, CAMPAGNE, VOTE_OUVERT, DEPOUILLEMENT, PUBLICATION, CLOTURE]

  /vote/request-otp:
    post:
      summary: Étape 1 du Vote — Demander un code OTP de 5 minutes
      operationId: requestOtp
      tags: [Vote Sécurisé]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [electionId]
              properties:
                electionId:
                  type: integer
      responses:
        '200':
          description: Code OTP généré et envoyé par e-mail
        '403':
          description: Changement de mot de passe requis (code PASSWORD_CHANGE_REQUIRED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  code:
                    type: string
                    example: PASSWORD_CHANGE_REQUIRED
                  message:
                    type: string
        '429':
          description: Trop de requêtes (limite 20 req/min/IP)

  /vote/verify-otp:
    post:
      summary: Étape 2 du Vote — Vérifier l'OTP et obtenir un VoteToken à usage unique
      operationId: verifyOtp
      tags: [Vote Sécurisé]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [electionId, otpCode]
              properties:
                electionId:
                  type: integer
      responses:
        '200':
          description: Code OTP généré et envoyé par e-mail
        '403':
          description: Changement de mot de passe requis (code PASSWORD_CHANGE_REQUIRED)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  code:
                    type: string
                    example: PASSWORD_CHANGE_REQUIRED
                  message:
                    type: string
        '429':
          description: Trop de requêtes (limite 20 req/min/IP)
                otpCode:
                  type: string
                  example: "849201"

  /vote/submit:
    post:
      summary: Étape 3 du Vote — Émettre un bulletin chiffré anonyme (AES-256)
      operationId: submitVote
      tags: [Vote Sécurisé]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [voteToken, electionId, candidatureId]
              properties:
                voteToken:
                  type: string
                electionId:
                  type: integer
                candidatureId:
                  type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

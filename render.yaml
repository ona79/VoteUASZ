databases:
  - name: voteuasz-db
    plan: free
    databaseName: voteuasz_db
    user: uasz_admin

services:
  - type: web
    name: voteuasz-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/elections
    envVars:
      # Profil Spring Boot
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Base de données PostgreSQL (injectée automatiquement depuis voteuasz-db)
      # Render injecte connectionString au format postgresql:// (non accepté par JDBC).
      # On injecte host/port/database séparément et application-prod.yml construit l'URL jdbc:postgresql://.
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: voteuasz-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: voteuasz-db
          property: port
      - key: SPRING_DATASOURCE_DB
        fromDatabase:
          name: voteuasz-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: voteuasz-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: voteuasz-db
          property: password

      # Clé de signature JWT (256 bits minimum) — générée automatiquement par Render
      - key: JWT_SECRET
        generateValue: true

      # Clé de chiffrement AES-256 des bulletins (32+ caractères) — générée automatiquement par Render
      # NOTE : CRYPTO_SECRET_KEY a été supprimé (doublon dangereux avec CRYPTO_SECRET)
      - key: CRYPTO_SECRET
        generateValue: true

      # Sel de hachage des IPs dans le journal d'émargement — généré automatiquement par Render
      - key: AUDIT_IP_SALT
        generateValue: true

      # URL Vercel du frontend Angular (ex : https://voteuasz.vercel.app)
      # À renseigner manuellement dans l'interface Render après le déploiement Vercel
      - key: ALLOWED_ORIGINS
        sync: false

      # Configuration SMTP pour l'envoi des codes OTP par e-mail
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_STARTTLS_ENABLE
        value: "true"

      # Mot de passe par défaut attribué aux électeurs importés via CSV (12+ car., fort)
      - key: DEFAULT_ELECTEUR_PASSWORD
        sync: false

      # Mot de passe par défaut attribué aux candidats importés via CSV (12+ car., fort)
      - key: DEFAULT_CANDIDAT_PASSWORD
        sync: false

      # Bootstrap du premier SUPER_ADMIN au démarrage (si aucun admin n'existe en base)
      # Ces variables sont utilisées une seule fois au premier démarrage.
      # Après création, vous pouvez les supprimer ou les laisser (elles seront ignorées).
      - key: ADMIN_MATRICULE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
